plugins {
  id 'com.android.application'
}

android {
  namespace 'pk.saudavo.app'
  compileSdk 34

  defaultConfig {
    applicationId 'pk.saudavo.app'
    minSdk 21
    targetSdk 34
    versionCode 4
    versionName '1.0.3'
  }

  signingConfigs {
    release {
      def ksPath = System.getenv('SAUDAVO_KEYSTORE_PATH')
      if (ksPath) {
        storeFile file(ksPath)
        storePassword System.getenv('SAUDAVO_KEYSTORE_PASSWORD')
        keyAlias System.getenv('SAUDAVO_KEY_ALIAS')
        keyPassword System.getenv('SAUDAVO_KEY_PASSWORD')
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      def ksPath = System.getenv('SAUDAVO_KEYSTORE_PATH')
      if (ksPath) {
        signingConfig signingConfigs.release
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
}
